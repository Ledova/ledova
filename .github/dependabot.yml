# Grouped so a weekly run opens a handful of pull requests, not forty.
# Every manifest in the repository is listed; add one here when a new one appears.
#
# Four ecosystems carry an `ignore` block for a specific major. Each one blocks its
# whole group: Dependabot bundles the breaking major with the routine bumps, the
# install or the build fails, and nothing in the group lands. Ignoring the one
# major lets the other twenty through, and names the upgrade as work somebody owns
# rather than a pull request that is red every Monday.
#
# The cost is real and worth stating: an `ignore` also suppresses Dependabot
# security updates for that package. Each block below therefore names the exact
# condition that lifts it, so it can be checked rather than assumed. Ignoring the
# major only - `version-update:semver-major` - keeps minors and patches flowing.
version: 2
updates:
  # TypeScript 7 removed `baseUrl` and the "node"/"node10" module resolutions.
  # dashboard/tsconfig.app.json uses baseUrl plus six non-relative path aliases that
  # 240 imports depend on, and packages/shared/tsconfig.json sets moduleResolution
  # "node", so `tsc -b` fails on the first file and `npm run typecheck` on the second.
  # Drop this when both tsconfigs are migrated (aliases rewritten as ./src/... targets,
  # moduleResolution "bundler") - see #122, which is the pull request this blocks.
  # ESLint 10 removed `context.getFilename()`, and eslint-plugin-react 7.37.5 -
  # its latest release - still calls it from lib/util/version.js:31. Every rule
  # routed through Components.componentRule throws before linting a single file:
  # "TypeError: Error while loading rule 'react/display-name':
  # contextOrFilename.getFilename is not a function". Drop this when
  # eslint-plugin-react ships a release that supports ESLint 10.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node runtime, which CI pins at 22. Version 26 drops
      # the Array `at()` declarations that dashboard and packages/shared compile
      # against under their ES2020 lib: 15 TS2550 errors in `npm run typecheck`
      # (#672). Drop this when the runtime moves past 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 7 enables the React Compiler rules, and the
      # dashboard has 46 errors under them (#672). Drop this when #673 is done.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
    groups:
      root-and-workspaces:
        patterns: ["*"]

  # The Expo and React Native toolchain is deliberately excluded, not grouped.
  # Its version is entangled with the client work in flight, and an SDK upgrade
  # is a deliberate change someone owns rather than an automated batch. Drop the
  # ignore block when Phase 1 settles and someone takes the upgrade.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: "@react-native/*"
      - dependency-name: metro
      - dependency-name: metro-*
      # The same reason as the block above, for names the `react-native-*` glob
      # misses. Expo pins these to an exact version per SDK in its own
      # bundledNativeModules.json - SDK 54 wants async-storage 2.2.0 and
      # datetimepicker 8.4.4, which is what package.json holds - and jest-expo's
      # major tracks the SDK, so jest-expo 57 is an SDK 57 preset. Dependabot
      # proposed all three in #138 while `expo` itself stayed on 54.
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: jest-expo
      # @noble/hashes 2 removed the ./sha256, ./sha512, ./ripemd160 and ./hmac
      # subpath exports. Six imports across bip32.ts, seedDerivation.ts,
      # localSigner.ts and secureKeyStorage.ts use them - the wallet derivation
      # path. The mobile type-check does not catch it: the root npm ci puts
      # @noble/hashes 1.8.0 in the repository root, TypeScript walks up to it when
      # the exports lookup fails in mobile/node_modules, and passes against a copy
      # Metro never bundles. Drop this when those imports move to /sha2.js,
      # /legacy.js and /hmac.js and the derived addresses are checked against
      # known vectors.
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
      # The ESLint 10 block from the root entry applies here too, and the root
      # entry does not reach this directory: `directory: /` covers packages/shared
      # and dashboard, the two root workspaces, while mobile has its own lockfile
      # and this entry. mobile is not exempt the way packages/shared is - it
      # carries eslint-plugin-react and mobile/eslint.config.mjs imports it,
      # registers it and spreads its recommended rules, which is where
      # react/display-name comes from. Without this, the next mobile batch takes
      # ESLint 10 and the `make lint` step below fails in a Dependabot pull
      # request rather than in anything a person wrote.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # react-test-renderer must equal `react`, which Expo SDK 54 pins at 19.1.0;
      # 19.3 fails `npm ci` with ERESOLVE (#668). It moves with the SDK above.
      - dependency-name: react-test-renderer
      # Babel 8 is an SDK change too: babel-preset-expo and Metro resolve their own
      # @babel/core 7, so 8 at the root leaves npm reporting an invalid tree and only
      # Jest on 8 (#668). Drop this with the SDK upgrade that adopts Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # jsdom 30 depends on the ESM-only @exodus/bytes, which Jest cannot load under
      # Node 22, so VerificationFormModal.test.tsx fails to run (#668). @types/jsdom
      # moves with it. Drop both when Jest loads it: Node 24.9+ or a transform.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jsdom"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 7.1 tightens the React Compiler rules: 28 new
      # errors against 7.0.1 (#668). Drop this when #673 is done.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]

  # ESLint 10 and TypeScript 7 are each blocked by a plugin at its own latest
  # release: eslint-plugin-import and eslint-plugin-react both cap their eslint peer
  # at 9, and typescript-eslint peers typescript <6.1.0. There is no version to
  # upgrade to, so `npm ci` refuses the tree and the whole group dies at install.
  # Drop each when its plugin ships a release admitting the new major.
  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]

  # Hardhat 3 is a rewrite, not a bump. @typechain/hardhat has no Hardhat 3
  # release and peers hardhat ^2.9.9, so the install cannot resolve at all; past
  # that, twelve files import the `ethers` Hardhat Runtime Environment global that
  # Hardhat 3 removed - six tests and six deploy scripts - and hardhat-toolbox 7
  # dropped typechain for its own type generation. This is a deliberate migration
  # somebody owns. Drop this block when it is taken.
  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: hardhat
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]
      # chai 6 is blocked by the same pin, one level down: hardhat-toolbox 4
      # requires hardhat-chai-matchers ^2, and 2.1.2 peers chai ^4.2.0, so
      # `npm ci` refuses the tree. @types/chai has to move with chai, not ahead
      # of it. Both lift when the Hardhat 3 migration above is taken.
      - dependency-name: chai
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/chai"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 belongs to the same migration: Hardhat 2 compiles its config
      # through ts-node, which fails on 7 before reading a contract ("Cannot read
      # properties of undefined (reading 'fileExists')", #665).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # OpenZeppelin is pinned at 5.4.0 by the recorded toolchain decision
      # (docs/decisions.md): 5.5 and later use Cancun's `mcopy`, which does not
      # compile for `paris` (#665). Only a needed feature or an advisory against
      # 5.4.0 reopens it, not a newer release.
      - dependency-name: "@openzeppelin/contracts"
        versions: [">=5.5.0"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
