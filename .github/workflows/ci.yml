name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: a pull request stacked on another branch
  # got no CI at all under `branches: [main]`, which is exactly the branch that
  # most needs it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Source and client checks
    needs: scope
    runs-on: ${{ fromJSON(needs.scope.outputs.runners)['checks'] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
      - name: Dependencies the gate scripts import
        run: pip install pyyaml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            site/package-lock.json
            mobile/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.5.2
      - name: Install dependencies
        run: make install
      - name: Full source and client checks
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          make ci-checks PYTHON=python PLAYWRIGHT_BROWSER_DEPS=--with-deps
      - name: Client operation coverage artefact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-operation-coverage
          path: /tmp/ledova-client-operations.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Smoke test artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke-results
          path: |
            dashboard/test-results
            dashboard/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  scope:
    name: Select CI runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.scope.outputs.runners }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the two execution runners
        id: scope
        run: python3 scripts/ci-runners.py select

  backend-suite:
    name: Django verdict
    needs: [scope, checks, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every required checks and backend job succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-runners.py verdict

  backend:
    name: Backend verification
    needs: scope
    runs-on: ${{ fromJSON(needs.scope.outputs.runners)['backend'] }}
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-only
      STORAGE_BACKEND: local
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ledova
      POSTGRES_USER: ledova
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=4g --memory=6g --memory-swap=6g
          --health-cmd "pg_isready -U ledova -d ledova" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/schema/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt -c backend/schema/requirements.txt
      - name: Complete core backend verification
        run: make backend-test PYTHON=python
      - name: PostgreSQL storage and resource diagnostics
        if: always()
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U ledova -d ledova -Atc 'SHOW fsync; SHOW synchronous_commit; SHOW full_page_writes;'
          docker exec "${{ job.services.postgres.id }}" df -B1 /var/lib/postgresql/data
          docker exec "${{ job.services.postgres.id }}" cat /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max
      - name: Generated schema, diagnostics, environment and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-schema-contract
          path: |
            /tmp/ledova-schema.json
            /tmp/ledova-schema-diagnostics.log
            /tmp/ledova-schema-environment.json
            /tmp/ledova-schema-comparison.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Backend phase diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-checks
          path: /tmp/ledova-backend-checks
          retention-days: 7
          if-no-files-found: ignore
