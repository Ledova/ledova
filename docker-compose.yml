name: ledova

# The core contracts on the stack's own chain. Development account #0 creates them at its nonces
# 0, 1 and 3 on a new chain, so these addresses never change; chain-deploy refuses a chain whose
# contracts are not these.
x-local-chain-contracts: &local-chain-contracts
  SHARE_TOKEN_FACTORY_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  STABLECOIN_CONTRACT_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
  ATOMIC_SWAP_ADDRESS: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"

# Every service built from ./backend gets the same local development settings.
# These environment entries override the optional ./backend/.env file.
x-backend-environment: &backend-environment
  <<: *local-chain-contracts
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  UPLOAD_SCANNER_HOST: clamav
  STORAGE_BACKEND: local
  DEBUG: "true"
  BLOCKCHAIN_RPC_URL: http://chain:8545
  BLOCKCHAIN_CHAIN_ID: "31337"
  # Development account #0 of the public test mnemonic (the same key as the Makefile's
  # CHAIN_TEST_OPERATOR_KEY). It is public and must never hold anything of value.
  BLOCKCHAIN_OPERATOR_KEY: &local-operator-key "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  # The receipt's own block counts as depth one, so a transaction is final once it is mined. This
  # chain mines a block only when a transaction arrives and, as a single node, never reorganises:
  # a greater depth would leave each issuance and swap waiting for the next transaction.
  LOCAL_CHAIN_FINALITY_DEPTH: "1"

services:
  chain:
    # Anvil from Foundry v1.8.3, pinned to the multi-platform image's digest.
    image: ghcr.io/foundry-rs/foundry:v1.8.3@sha256:2e4287278639262de76db72477301d5d3212fa1b1cce710d7d148750a46ce9e7
    # The image's own user cannot write the root-owned volume, and Anvil then keeps nothing
    # without saying so.
    user: root
    # Anvil itself is PID 1, so the SIGTERM from `docker compose stop` or `down` reaches it and it
    # writes its state before exiting. It also rewrites the whole state every five seconds, which
    # bounds what a hard kill can lose.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--state", "/state/state.json", "--state-interval", "5"]
    stop_grace_period: 30s
    ports:
      # For browser wallets and a backend run on the host. While the stack is up, give
      # `make chain-test` another port: make chain-test CHAIN_TEST_PORT=8546.
      - "127.0.0.1:8545:8545"
    volumes:
      - chain_data:/state
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cast chain-id --rpc-url http://127.0.0.1:8545)\" = 31337"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Runs on every start, before anything that signs. On a new chain it deploys the core contracts
  # with `npm run deploy:local:core`; on every chain it checks them and exits non-zero if what it
  # finds differs. Anvil resumes its clock at the latest block's time after a restart, so this
  # also sets the clock back to the present.
  chain-deploy:
    build:
      context: ./contracts
    environment:
      <<: *local-chain-contracts
      LOCALHOST_RPC_URL: http://chain:8545
      DEPLOYER_PRIVATE_KEY: *local-operator-key
    depends_on:
      chain:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5.4
    # /init starts clamd and the Freshclam daemon together, and clamd refuses signatures older than the
    # seven days FailIfCvdOlderThan allows. A new volume is filled from the image's own signatures, so
    # update once first; offline, this falls through to the image's normal start.
    entrypoint: ["/bin/sh", "-c", "freshclam --foreground --stdout --user=clamav || true; exec /init \"$$@\"", "sh"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    volumes:
      - ./backend/.deployment/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1", "--config-file=/etc/clamav/clamd.conf"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # shared/0003 creates ledova_app and ledova_operator with LOGIN and no password,
      # deliberately: a credential does not belong in a migration. Without this the
      # image initdb's with scram-sha-256, the two roles can never authenticate over
      # the compose bridge, and the stack dies at the first post-migrate ORM call.
      # docs/operations/configuration.md says local work uses trust as CI does; this is where it is
      # applied. initdb reads it on FIRST start only - an existing volume needs the
      # ALTER ROLE recipe in that section instead.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: sh -c "python manage.py migrate --noinput && python manage.py check_rls_roles && python manage.py sync_monitoring_rules && python manage.py sync_procedure_templates && python manage.py asset_sync --seed-only && python manage.py admit_local_signer"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chain:
        condition: service_healthy
      chain-deploy:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: uvicorn ledova_backend.asgi:application --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      clamav:
        condition: service_started
      chain:
        condition: service_healthy
      chain-deploy:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: python manage.py procrastinate worker --queues=default,builtin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      clamav:
        condition: service_started
      chain:
        condition: service_healthy
      chain-deploy:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/.deployment/Dockerfile.dev
    env_file:
      - path: ./dashboard/.env
        required: false
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - backend

  marketing:
    build:
      context: ./marketing
      dockerfile: .deployment/Dockerfile.dev
    env_file:
      - path: ./marketing/.env
        required: false
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  chain_data:
  clamav_data:
  media_data:
  private_media_data:
  postgres_data:
  redis_data:
